name: Deploy to Azure App Service

# Builds Next.js standalone output in CI and ships the finished bundle to
# Azure App Service (Free F1 tier) — Azure just runs `node server.js`, no
# remote Oryx build. See README.md "Deploy" section for the one-time setup.
#
# This is the ONLY deploy workflow for this app. Do not re-enable Azure
# Portal's "Deployment Center" continuous deployment for this Web App — it
# auto-commits its own generic workflow (main_<appname>.yml) that uploads
# the raw repo instead of the standalone bundle, which is incompatible with
# the `node server.js` Startup Command below and races this workflow on
# every push. If it reappears, delete it and reuse the publish-profile
# secret it creates (named AZUREAPPSERVICE_PUBLISHPROFILE_<hash>) below —
# it's fetched programmatically by Azure's backend, more reliable than a
# manually copy-pasted one.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Build
        run: npm run build
        # No DATABASE_URL here on purpose: lib/prisma.ts constructs its
        # adapter lazily on first query, never at module import time, so the
        # build never needs real DB credentials (dashboard pages are also
        # dynamic, not statically generated — see PRD section 11). The real
        # connection string lives only in the Web App's Application
        # Settings, set once in the Azure Portal (see README "Deploy").

      - name: Assemble standalone bundle
        # Next.js standalone output deliberately omits static assets and the
        # public folder — they must be copied in alongside server.js.
        # https://nextjs.org/docs/app/api-reference/config/next-config-js/output
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          # Azure's Deployment Center created this one automatically (fetched
          # via its backend, not copy-pasted) — reusing it instead of a
          # manually-added AZURE_WEBAPP_PUBLISH_PROFILE secret.
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_DF3ACFD8B653440A8A0D3EF3542F9B44 }}
          package: .next/standalone
